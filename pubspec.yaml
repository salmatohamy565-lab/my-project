name: bola_designs
description: "A professional Flutter mobile application for Bola Designs management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.5.0+1

  # Responsiveness & Fonts
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # Local Cache & Utilities
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.3


  # File handling
  file_picker: ^8.0.3
  open_filex: ^4.4.0
  flutter_svg: ^2.0.10+1

  # Icon packs
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Register assets
  assets:
    - assets/
    - assets/product_images/
