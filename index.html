<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Bola Designs - بولا ديزاينز | تحميل التطبيق الرسمي</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-black: #111827;
            --secondary-black: #1f2937;
            --accent-gray: #f3f4f6;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #f1f5f9 0%, #f8fafc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            color: var(--text-dark);
        }

        .main-card {
            background: var(--card-bg);
            border-radius: 36px;
            padding: 40px 32px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Brand Header */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo-img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 16px;
            background: #ffffff;
            padding: 4px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--primary-black);
            text-transform: uppercase;
        }

        .app-desc {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* App Screenshot Showcase */
        .preview-container {
            width: 100%;
            max-width: 320px;
            background: #ffffff;
            border-radius: 28px;
            padding: 10px;
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.09);
            border: 2px solid #111827;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .preview-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.14);
        }

        .preview-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            display: block;
        }

        /* Action Buttons */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px;
            background: var(--primary-black);
            color: #ffffff;
            text-decoration: none;
            font-size: 19px;
            font-weight: 800;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(17, 24, 39, 0.3);
            transition: all 0.25s ease;
        }

        .download-btn:hover {
            background: #000000;
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        /* QR Code & Scan Option */
        .qr-toggle-section {
            margin-top: 24px;
            width: 100%;
            border-top: 1px dashed var(--border-color);
            padding-top: 20px;
        }

        .qr-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: var(--accent-gray);
            border-radius: 18px;
            padding: 12px 16px;
            margin-top: 12px;
        }

        .qr-box img {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            background: #ffffff;
            padding: 4px;
            border: 1px solid var(--border-color);
        }

        .qr-info {
            text-align: right;
            flex: 1;
        }

        .qr-info h4 {
            font-size: 13px;
            font-weight: 800;
            color: var(--primary-black);
            margin-bottom: 3px;
        }

        .qr-info p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Footer badges */
        .badges-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .file-info {
            margin-top: 16px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- Logo & Header -->
        <div class="brand-header">
            <img src="/bola_logo.png" onerror="this.src='/logo_dark.png'" alt="Bola Designs Logo" class="logo-img">
            <div class="brand-title">BOLA DESIGNS</div>
        </div>

        <p class="app-desc">التطبيق الرسمي لتصفح البراويز، الهدايا، المجات وإدارة الطلبات</p>

        <!-- App Screen Preview -->
        <div class="preview-container">
            <img src="/app_preview.png" alt="واجهة تطبيق Bola Designs" class="preview-img">
        </div>

        <!-- Download Button -->
        <a id="downloadBtn" href="/app-release.apk" download="Bola_Designs.apk" class="download-btn">
            <i class="fa-solid fa-download"></i>
            <span>تحميل التطبيق (APK)</span>
        </a>

        <!-- QR Code Barcode -->
        <div class="qr-toggle-section">
            <div class="qr-box">
                <img id="qrCode" src="" alt="QR Code للتحميل السريع">
                <div class="qr-info">
                    <h4>مسح الكود بكاميرا الموبايل</h4>
                    <p>وجّهي كاميرا هاتفك للتحميل الفوري المباشر</p>
                </div>
            </div>
        </div>

        <!-- Trust Badges -->
        <div class="badges-row">
            <div class="badge-item">
                <i class="fa-solid fa-shield-halved" style="color: #10b981;"></i>
                <span>آمن ومفحوص 100%</span>
            </div>
            <div class="badge-item">
                <i class="fa-solid fa-bolt" style="color: #f59e0b;"></i>
                <span>تحميل سريع ومباشر</span>
            </div>
        </div>

        <div class="file-info">
            <i class="fa-brands fa-android"></i> نسخة أندرويد الرسمية (58 MB) • v1.0.0
        </div>
    </div>

    <script>
        const apkUrl = window.location.origin + '/app-release.apk';
        // توليد QR Code باللون الأسود الملكي المتناسق مع هوية التطبيق
        const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(apkUrl)}&color=111827`;
        
        document.getElementById('qrCode').src = qrApi;
        document.getElementById('downloadBtn').href = apkUrl;
    </script>
</body>
</html>
