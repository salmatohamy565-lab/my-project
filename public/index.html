<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق Bola Designs - بولا ديزاينز</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: #ffffff;
        }

        .phone-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 36px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 42px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.4);
        }

        .app-name {
            font-size: 26px;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .app-desc {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .qr-wrapper {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease;
        }

        .qr-wrapper:hover {
            transform: scale(1.03);
        }

        .qr-wrapper img {
            width: 190px;
            height: 190px;
            display: block;
            border-radius: 14px;
        }

        .qr-label {
            font-size: 13px;
            color: #475569;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            font-weight: 800;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .file-info {
            margin-top: 18px;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="phone-card">
        <div class="logo-box">
            <i class="fa-solid fa-gem"></i>
        </div>

        <h1 class="app-name">Bola Designs - بولا ديزاينز</h1>
        <p class="app-desc">التطبيق الرسمي لتصفح وإدارة التصاميم والطلبات</p>

        <div class="qr-wrapper">
            <img id="qrCode" src="" alt="QR Code للتحميل">
        </div>

        <div class="qr-label">
            <i class="fa-solid fa-qrcode" style="color: #6366f1;"></i>
            <span>امسحي الكود بكاميرا الموبايل للتحميل المباشر</span>
        </div>

        <a id="downloadBtn" href="/app-release.apk" download="Bola_Designs.apk" class="download-btn">
            <i class="fa-solid fa-download"></i>
            <span>تحميل التطبيق</span>
        </a>

        <div class="file-info">
            <i class="fa-brands fa-android" style="color: #22c55e;"></i>
            <span>نسخة الأندرويد الرسمية APK (58 MB) • v1.0.0</span>
        </div>
    </div>

    <script>
        // استخدام الرابط المباشر من نفس دومين Vercel
        const apkUrl = window.location.origin + '/app-release.apk';
        const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(apkUrl)}&color=6366f1`;
        
        document.getElementById('qrCode').src = qrApi;
        document.getElementById('downloadBtn').href = apkUrl;
    </script>
</body>
</html>
