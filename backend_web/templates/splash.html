<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>مرحبا — Bola Designs</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: radial-gradient(circle at top, #0b1c33 0%, #081224 40%, #020712 100%);
        color: #eef2ff;
        font-family: 'Cairo', 'Poppins', Arial, sans-serif;
        overflow: hidden;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top center, rgba(59, 130, 246, 0.16), transparent 22%),
                    radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.14), transparent 18%),
                    linear-gradient(180deg, rgba(8, 14, 29, 0.96), rgba(4, 8, 18, 0.98));
        z-index: 9999;
        flex-direction: column;
        padding: 24px;
        text-align: center;
      }
      .splash::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 40%);
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 680px;
        background: rgba(7, 15, 32, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 32px;
        padding: 44px 36px;
        box-shadow: 0 38px 90px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px);
        overflow: hidden;
      }
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at top left, rgba(56,189,248,0.18), transparent 24%);
        pointer-events: none;
      }
      .logo-wrap {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
        transition: opacity 0.8s ease, transform 0.8s ease;
      }
      .logo-wrap.visible {
        opacity: 1;
        transform: none;
      }
      .logo-wrap img {
        width: 110px;
        height: auto;
        display: block;
        margin: 0 auto;
      }
      .tag {
        margin-top: 28px;
        color: #f8fafc;
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: 0.03em;
      }
      .subtag {
        margin-top: 14px;
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.9;
        max-width: 520px;
        margin-left: auto;
        margin-right: auto;
      }
      .progress {
        margin-top: 34px;
        height: 8px;
        width: 100%;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.14);
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #38bdf8, #6366f1);
        border-radius: 999px;
        animation: fillBar 2.2s ease forwards;
      }
      .fade-out {
        animation: fadeOut 0.6s ease-in-out forwards;
      }
      @keyframes fadeOut {
        to { opacity: 0; transform: scale(0.98); visibility: hidden; }
      }
      @keyframes fillBar {
        to { width: 100%; }
      }
      .skip {
        margin-top: 24px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #eef2ff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255,255,255,0.12);
        padding: 14px 20px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 700;
        box-shadow: 0 22px 42px rgba(0, 0, 0, 0.18);
        transition: transform 0.22s ease, background 0.22s ease;
      }
      .skip:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="card">
        <div class="logo-wrap" id="logoWrap">
          <img src="/static/logo2.svg?v={{ STATIC_VERSION }}" alt="Bola Designs logo">
        </div>
        <div class="tag">مرحباً بك في نظام Bola Designs</div>
        <div class="subtag">نجهز لك واجهة احترافية لإدارة المهام والموظفين. سيتم الانتقال تلقائياً للوحة التحكم.</div>
        <div class="progress"><div class="progress-bar"></div></div>
      </div>
      <a class="skip" id="skipLink" href="{{ next_url }}">تخطي</a>
    </div>

    <script>
      (function () {
        var logo = document.getElementById('logoWrap');
        var splash = document.getElementById('splash');
        var skip = document.getElementById('skipLink');
        window.addEventListener('load', function () { logo.classList.add('visible'); });
        var next = "{{ next_url }}";
        var delay = 2200;
        var hide = function () {
          splash.classList.add('fade-out');
          setTimeout(function () { window.location.href = next; }, 650);
        };
        var timer = setTimeout(hide, delay);
        skip.addEventListener('click', function () { clearTimeout(timer); });
      })();
    </script>
  </body>
</html>
