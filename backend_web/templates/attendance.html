<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحضور والغياب | Bola Designs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body data-page="attendance">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand"><i class="fas fa-calendar-check"></i><span>Bola Designs</span></div>
            <nav class="sidebar-nav">
                <a class="nav-item" href="/admin"><i class="fas fa-home"></i><span>لوحة التحكم</span></a>
                <a class="nav-item active" href="/admin/attendance"><i class="fas fa-calendar-check"></i><span>الحضور والغياب</span></a>
                <a class="nav-item" href="/admin/files"><i class="fas fa-file-upload"></i><span>إدارة الملفات</span></a>
                <a class="nav-item" href="/login" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج</span></a>
            </nav>
        </aside>
        <main class="content-area">
            <div class="page-card">
                <div class="page-header">
                    <div>
                        <div class="page-title">الحضور والغياب</div>
                        <div class="page-subtitle">تسجيل حضور أو غياب أي موظف بدقة</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fas fa-calendar-check"></i></div>
                        <div>
                            <div class="card-title">سجل اليوم</div>
                            <div class="card-subtitle">سجل حضور أو غياب أي موظف من هنا</div>
                        </div>
                    </div>
                    <form id="attendanceForm">
                        <div id="attendanceMsg"></div>
                        <div class="form-group"><label>الموظف</label><select id="attendanceUser" required></select></div>
                        <div class="form-group"><label>التاريخ</label><input type="date" id="attendanceDate" required></div>
                        <div class="form-group"><label>الحالة</label><select id="attendanceStatus" required><option value="present">حضور</option><option value="absent">غياب</option></select></div>
                        <button type="submit" class="btn-primary">حفظ الحالة</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script>
        const BASE_URL = '/api';
        async function logout() {
            await fetch(BASE_URL + '/logout', { method: 'POST' });
            window.location.href = '/login';
        }
        async function loadUsers() {
            const res = await fetch(BASE_URL + '/users');
            if (!res.ok) return;
            const users = await res.json();
            document.getElementById('attendanceUser').innerHTML = '<option value="">-- اختر موظف --</option>' + users.filter(u => u.role !== 'admin').map(u => `<option value="${u.id}">${u.username}</option>`).join('');
        }
        document.getElementById('attendanceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('attendanceMsg');
            const res = await fetch(BASE_URL + '/attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: parseInt(document.getElementById('attendanceUser').value), attendance_date: document.getElementById('attendanceDate').value, status: document.getElementById('attendanceStatus').value })
            });
            const data = await res.json();
            msgDiv.className = res.ok ? 'message success' : 'message error';
            msgDiv.textContent = res.ok ? '✓ تم حفظ الحالة بنجاح' : '✗ ' + (data.error || 'فشل الحفظ');
        });
        loadUsers();
        document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
