<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Bola Designs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=STATIC_VERSION) }}">
</head>
<body data-page="login">
    <div class="app">
        <div class="auth-page">
            <div class="login-card">
                <div class="login-header">
                    <img class="login-logo" src="/static/logo2.svg?v={{ STATIC_VERSION }}" alt="Bola Designs logo">
                    <div>
                        <div class="login-title">مرحبا بك في نظام Bola Designs</div>
                        <div class="login-subtitle">ادخل بياناتك لتسجيل الدخول والوصول إلى لوحة التحكم الاحترافية.</div>
                    </div>
                </div>
                <div id="loginError" class="login-error hidden"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">اسم المستخدم</label>
                        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                    </div>
                    <div class="form-group">
                        <label for="password">كلمة السر</label>
                        <input type="password" id="password" placeholder="أدخل كلمة السر" required>
                    </div>
                    <div class="form-group remember-row">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">تذكرني على هذا الجهاز</label>
                    </div>
                    <button type="submit" class="btn">دخول</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;
            const errorDiv = document.getElementById('loginError');
            errorDiv.className = 'login-error hidden';
            errorDiv.textContent = '';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, remember })
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = data.user.role === 'admin' ? '/admin' : '/employee';
                } else {
                    errorDiv.className = 'login-error';
                    errorDiv.textContent = data.error || 'فشل تسجيل الدخول';
                }
            } catch (err) {
                errorDiv.className = 'login-error';
                errorDiv.textContent = 'حدث خطأ: ' + err.message;
            }
        });
    </script>
</body>
</html>
